<!DOCTYPE html>
<html lang="et">
<head>
  <meta charset="UTF-8">
  <title>Muusika ankeet</title>
  <link rel="stylesheet" href="vormid/muusikaStyle.css">
  <script src="js/muusikaScript.js"></script>
</head>
<body>
<h1>Muusika ankeet</h1>
<form action="#">
  <table>
    <tr>
      <th>Küsimused</th>
      <th>Vastused</th>
    </tr>

    <!-- 1. checkbox -->
    <tr>
      <td><strong>1. Milliseid muusikuid/ansambleid sa tead?</strong></td>
      <td>
        <input type="checkbox" name="muusik" id="metallica" value="Metallica" onchange="muusikudValik()">
        <label for="metallica">Metallica</label><br>

        <input type="checkbox" name="muusik" id="queen" value="Queen" onchange="muusikudValik()">
        <label for="queen">Queen</label><br>

        <input type="checkbox" name="muusik" id="abba" value="ABBA" onchange="muusikudValik()">
        <label for="abba">ABBA</label><br>

        <input type="checkbox" name="muusik" id="eminem" value="Eminem" onchange="muusikudValik()">
        <label for="eminem">Eminem</label><br>

        <input type="checkbox" name="muusik" id="tuuli" value="Tuuli" onchange="muusikudValik()">
        <label for="tuuli">Tuuli</label>

        <div id="vastus1" class="tulemus"></div>
        <div id="pildid1"></div>
      </td>
    </tr>

    <!-- 2. textarea -->
    <tr>
      <td><strong>2. Mida arvad muusika kuulamisest koolis?</strong></td>
      <td>
        <textarea id="arvamus" name="arvamus" rows="4" cols="40" oninput="arvamusLugemine()"></textarea>
        <div id="vastus2" class="tulemus"></div>
      </td>
    </tr>

    <!-- 3. number -->
    <tr>
      <td><strong>3. Mitu tundi päevas sa kuulad muusikat?</strong></td>
      <td>
        <input type="number" min="0" max="24" step="1" id="tunnid" name="tunnid" oninput="tunnidLugemine()">
        <div id="vastus3" class="tulemus"></div>
      </td>
    </tr>

    <!-- 4. radio jah/ei -->
    <tr>
      <td><strong>4. Kas sa kuulad raadiot?</strong></td>
      <td>
        <input type="radio" name="raadio" id="jah" value="jah" onclick="raadioValik()">
        <label for="jah">jah</label>
        <input type="radio" name="raadio" id="ei" value="ei" onclick="raadioValik()">
        <label for="ei">ei</label>
        <div id="vastus4" class="tulemus"></div>
      </td>
    </tr>

    <!-- 5. text -->
    <tr>
      <td><strong>5. Milliseid raadiojaamu oskad nimetada?</strong></td>
      <td>
        <input type="text" id="jaamad" name="jaamad" oninput="jaamadLugemine()">
        <div id="vastus5" class="tulemus"></div>
      </td>
    </tr>

    <!-- 6. select -->
    <tr>
      <td><strong>6. Millist muusikat sa kõige rohkem kuulad?</strong></td>
      <td>
        <select name="stiil" id="stiil" onchange="stiilValik()">
          <option value="vali">vali...</option>
          <option value="pop">pop</option>
          <option value="rock">rock</option>
          <option value="hiphop">hip-hop</option>
          <option value="klassikaline">klassikaline</option>
          <option value="elektrooniline">elektrooniline</option>
          <option value="jazz">jazz</option>
        </select>
        <div id="vastus6" class="tulemus"></div>
      </td>
    </tr>

    <!-- 7 ja 8. nupud -->
    <tr>
      <td>
        <input type="button" value="Saada" onclick="saada()">
        <input type="reset" value="Puhasta" onclick="puhasta()">
      </td>
      <td>
        <div id="kokkuvote"></div>
        <div id="esinejad"></div>
      </td>
    </tr>
  </table>
</form>
</body>
</html>
