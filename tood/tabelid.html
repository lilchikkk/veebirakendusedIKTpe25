<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <title>Tabelid HTML-keeles</title>
    <link rel="stylesheet" href="tabeliStyle.css">
</head>
<body>

<h1>Tabelid HTML-Keeles</h1>

<h2>Kõige lihtsam tabel</h2>
<table id="sinine">
    <caption>Tabel 1.</caption>
    <!--1.rida-->
    <tr>
        <td>1</td>
        <td>2</td>
    </tr>
    <!--2.rida-->
    <tr>
        <td>3</td>
        <td>4</td>
    </tr>
</table>

<h2>Natuke keerulisem tabel</h2>
<table id="punane">
    <caption>Tabel 2.</caption>
    <!--1.rida-->
    <tr>
        <td colspan="2">1</td>
    </tr>
    <!--2.rida-->
    <tr>
        <td>3</td>
        <td>4</td>
    </tr>
</table>

<h2>Veel üks natuke keerulisem tabel</h2>
<table id="roheline">
    <caption>Tabel 3.</caption>
    <!--1.rida-->
    <tr>
        <td rowspan="2">1</td>
        <td>2</td>
    </tr>
    <!--2.rida-->
    <tr>
        <td>4</td>
    </tr>
</table>

<h2>Nüüd üks keeruline tabel</h2>
<table id="pink">
    <caption>Tabel 4.</caption>
    <!-- 1. rida -->
    <tr>
        <td rowspan="4">1</td>
        <td colspan="3">2</td>
    </tr>
    <!-- 2. rida -->
    <tr>
        <td colspan="2">4</td>
        <td>5</td>
    </tr>
    <!-- 3. rida -->
    <tr>
        <td class="c6">6</td>
        <td colspan="2">7</td>
        <td rowspan="2">8</td>
    </tr>
    <!-- 4. rida -->
    <tr>
        <td>9</td>
        <td colspan="2">10</td>
    </tr>
</table>
</body>
</html>
