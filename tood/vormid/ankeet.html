<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <title>Vormid ja nupud HTML keeles</title>
    <script src="../js//ankeetScript.js"></script>
</head>
<body>
<h1>Sportlase ankeet</h1>
<form action="#">
    <table>
        <tr>
            <td>
                <label for="nimi">Sisesta oma nimi:</label>
            </td>
            <td>
                <input type="text" id="nimi" name="nimi" oninput="nimiLugemine()">
            </td>
            <td>
                <div id="vastus"></div>
            </td>
        </tr>
        <tr>
            <td>
                <strong>Vali sugu:</strong>
            </td>
            <td>
                <!-- radionupp - ainult üks valik on õige -->
                <input type="radio" name="sugu" id="naine"  value="naine" onclick="suguValik()">
                <label for="naine">naine</label>
                <br>
                <input type="radio" name="sugu" id="mees"  value="mees" onclick="suguValik()">
                <label for="mees">mees</label>
                <br>
                <input type="radio" name="sugu" id="muu"  value="muu" onclick="suguValik()">
                <label for="muu">muu</label>
            </td>
            <td>
                <div id="vastus2"></div>
            </td>
        </tr>
        <tr>
            <td>
                <strong>Spordialad</strong>
            </td>
            <td>
                <fieldset>
                    <legend>Spordialad:</legend>

                    <strong>Spordialad</strong>
                    <br>

                    <input type="checkbox" name="spordiala" id="jooksmine" value="jooksmine" onchange="sportValik()">
                    <label for="jooksmine">jooksmine</label>
                    <br>

                    <input type="checkbox" name="spordiala" id="ujumine" value="ujumine"onchange="sportValik()">
                    <label for="ujumine">ujumine</label>
                    <br>

                    <input type="checkbox" name="spordiala" id="suusatamine" value="suusatamine"onchange="sportValik()">
                    <label for="suusatamine">suusatamine</label>
                    <br>

                    <input type="checkbox" name="spordiala" id="uisutamine" value="uisutamine"onchange="sportValik()">
                    <label for="uisutamine">uisutamine</label>
                    <br>

                    <input type="checkbox" name="spordiala" id="poks" value="poks"onchange="sportValik()">
                    <label for="poks">poks</label>
                    <br>

                </fieldset>

            </td>
            <td>
                <div id="vastus3"></div>
            </td>
        </tr>

        <tr>
            <td>
                <label for="tund">Mitu tundi nädalas sina trennid?</label>
            </td>
            <td>
                <input type="number" min="1" max="24" step="1" value="6" id="tund" name="tund">
            </td>
        </tr>
        <tr>
            <td>
                <label for="klubi">Mis klubi sa külastad?</label>
            </td>
            <td>
                <select name="klubi" id="klubi">
                    <option value="vali">vali...</option>
                    <option value="gym">GYM</option>
                    <option value="myfitnes">MyFitnes</option>
                    <option value="gym24">Gym24</option>
                    <option value="kalevspa">KalevSpa</option>
                </select>
            </td>
        </tr>
        <tr>
            <td>
                <label for="varv">Mis värvi tossud sul on?</label>
            </td>
            <td>
                <input type="color" id="varv">
            </td>
        </tr>
        <tr>
            <td>
                <label for="kuupaev">Millal oli su viimane trenn?</label>
            </td>
            <td>
                <input type="date" id="kuupaev" min="2026-12-31">
            </td>
        </tr>
        <tr>
            <!-- USERNAME -->
            <td>
                <label for="username">Username:</label><br>
            </td>
            <td>
                <input type="text" id="username" name="username">
            </td>
        </tr>
        <tr>
            <td>
                <label for="pwd">Parool:</label><br>
            </td>
            <td>
                <input type="password" id="pwd" name="pwd">
            </td>
        </tr>
        <tr>
            <td>
                <label for="birthdaytime">Sinu sünnipäev (data ja aeg):</label>
            </td>
            <td>
                <input type="datetime-local" id="birthdaytime" name="birthdaytime">
            </td>
        </tr>
        <tr>
            <td>
                <label for="email">Palun kirjuta siia oma e-posti adress:</label>
            </td>
            <td>
                <input type="email" id="email" name="email">
            </td>
        </tr>
        <tr>
            <td>
                <label for="myfile">Vajuta fail:</label>
            </td>
            <td>
                <input type="file" id="myfile" name="myfile">
            </td>
        </tr>
        <tr>
            <td>
                <label for="phone">Kirjuta oma telefoninumber:</label>
            </td>
            <td>
                <input type="tel" id="phone" name="phone" pattern="[0-9]{3}-[0-9]{2}-[0-9]{3}">
            </td>
        </tr>
        <tr>
            <td>
                <label for="appt">Select a time:</label>
            </td>
            <td>
                <input type="time" id="appt" name="appt">
            </td>
        </tr>
        <tr>
            <td>
                <input type="reset" value="Puhasta" onclick="puhasta()">
            </td>
            <td>
                <input type="button" value="Näita andmed" onclick="tervitus()">
            </td>
            <td>
                <div id="vastus4"></div>
            </td>
        </tr>
    </table>
</form>
</body>
</html>
