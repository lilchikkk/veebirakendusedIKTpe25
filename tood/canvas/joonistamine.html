<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <title>Joonistamisrakendus canvas-ga</title>
    <link rel="stylesheet" href="canvasStyle.css">
    <script src="joonisScript.js"></script>
</head>
<body>
<h1>Joonistamisrakendus canvas-ga</h1>
<input type="button" value="Puhasta" onclick="puhasta()">
<canvas id="tahvel" width="300" height="400" ></canvas>
<br>
<input type="button" value="Joon" onclick="sirgeJoon()">
<br>
<input type="button" value="Kolmnurk" onclick="kolmnurk()">
<br>
<input type="button" value="Ristkülik" onclick="ristkylik()">
<label for="laius">Laius</label>
<input type="number" min="1" max="300" step="10" id="laius" onchange="ristkylik()">
<label for="korgus">Kõrgus</label>
<input type="number" min="1" max="300" step="10" id="korgus" onchange="ristkylik()">
<br>
<input type="button" value="Ring" onclick="ring()">
<input type="number" min="1" max="150" step="1" id="raadius" onchange="ring()">
<input type="color" id="varv" onchange="ring()">
<br>

<input type="button" value="Smail (Täielik)" onclick="smail()">
<br>
<input type="button" value="Smaili Pea" onclick="smailPea()">
<br>
<input type="button" value="Smaili Silmad" onclick="smailSilmad()">
<br>
<input type="button" value="Smaili Nina" onclick="smailNina()">
<label for="ninaLaius">Laius</label>
<input type="number" min="1" max="100" step="5" id="ninaLaius" value="10" onchange="smailNina()">
<label for="ninaKorgus">Kõrgus</label>
<input type="number" min="1" max="100" step="5" id="ninaKorgus" value="30" onchange="smailNina()">
<br>
<input type="button" value="Smaili Kõrvad" onclick="smailKorvad()">
<label for="korvLaius">Laius</label>
<input type="number" min="1" max="100" step="5" id="korvLaius" value="15" onchange="smailKorvad()">
<label for="korvKorgus">Kõrgus</label>
<input type="number" min="1" max="100" step="5" id="korvKorgus" value="40" onchange="smailKorvad()">
<br>
<input type="button" value="Smaili Suu" onclick="smailSuu()">

<br>
<input type="button" value="Pilt" onclick="pilt()">
</body>
</html>
