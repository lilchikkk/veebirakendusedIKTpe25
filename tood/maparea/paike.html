<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <title>Map area kasutamine</title>
    <link rel="stylesheet" href="mapStyle.css"/>
</head>
<body>
<h1>Lehel on kasutatud map area käske</h1>
<h2>Palun kliki hiirega pildi erinevatele aladele</h2>

<img src="maja.png" alt="ilus majake" usemap="#majakaart" width="300" height="300">

<map name="majakaart">

    <area shape="rect" coords="60,90,150,10,240,90" href="maja.html" alt="maja seinad">
    <area shape="poly" coords="60,90,150,10,240,90" href="katus.html" alt="katus">


    <area shape="rect" coords="64,84,230,120" href="korsten.html" alt="hall korsten">
    <area shape="circle" coords="196,162,30" href="aken.html" alt="aken">


    <area shape="circle" coords="28,30,25" href="paike.html" alt="päike">
    <area shape="rect" coords="270,65,32" href="taht.html" alt="täht">
</map>

<div id="selgitus">
    <h2>Päike</h2>
    <p>Päike on heledaim Maalt nähtav täht, Päikesesüsteemi keskne keha.</p>

</div>

</body>
</html>
